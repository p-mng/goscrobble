version: "2"
linters:
  # https://golangci-lint.run/usage/linters/#enabled-by-default
  enable:
    - exhaustive
    - exhaustruct_v5
    - goconst
    - gocritic
    - gosec
    - nilnil
    - revive
    - unused
  exclusions:
    presets:
      - comments
  settings:
    exhaustruct_v5:
      ignore-patterns:
        - 'github.com\/rs\/zerolog\..*'
        - 'github.com\/urfave\/cli\/v3\..*'
        - 'net\/http\..*'
      allow-empty: true
